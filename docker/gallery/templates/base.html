<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PhotoSorter Gallery{% endblock %}</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a2e;
            --surface2: #16213e;
            --primary: #0f3460;
            --accent: #e94560;
            --text: #eee;
            --text-subtle: #999;
            --border: #2a2a4a;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* NAV */
        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        .navbar .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            margin-right: 32px;
        }
        .navbar .logo span { color: var(--text); }
        .navbar nav { display: flex; gap: 4px; }
        .navbar nav a {
            color: var(--text-subtle);
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 14px;
        }
        .navbar nav a:hover, .navbar nav a.active {
            background: var(--primary);
            color: var(--text);
            text-decoration: none;
        }

        /* CONTAINER */
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        /* CARDS */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
        }

        /* PHOTO GRID */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .photo-grid .photo-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 1;
            background: var(--surface2);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .photo-grid .photo-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.2);
        }
        .photo-grid .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-grid .photo-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 11px;
            color: #ccc;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .photo-grid .photo-item:hover .overlay { opacity: 1; }

        /* ALBUM GRID */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .album-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .album-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.15);
        }
        .album-card .album-cover {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            background: var(--primary);
            display: block;
        }
        .album-card .album-info {
            padding: 12px 16px;
        }
        .album-card .album-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }
        .album-card .album-info .count {
            font-size: 13px;
            color: var(--text-subtle);
        }

        /* STATS */
        .stats-row {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 28px;
            flex: 1;
            min-width: 160px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-card .label {
            font-size: 14px;
            color: var(--text-subtle);
            margin-top: 4px;
        }

        /* FILTERS */
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-subtle);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            text-decoration: none;
        }

        /* PAGINATION */
        .pagination {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 24px;
        }
        .pagination a, .pagination span {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-subtle);
            font-size: 13px;
        }
        .pagination a:hover { background: var(--primary); color: var(--text); text-decoration: none; }
        .pagination .current { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* SECTION HEADERS */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .section-header h2 { font-size: 22px; font-weight: 600; }

        /* PHOTO VIEWER */
        .viewer {
            text-align: center;
            padding: 20px;
        }
        .viewer img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .viewer-nav {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
        }
        .viewer-nav a {
            padding: 10px 24px;
            border-radius: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .viewer-nav a:hover { background: var(--primary); text-decoration: none; }

        .meta-table {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            border-collapse: collapse;
        }
        .meta-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .meta-table td:first-child {
            color: var(--text-subtle);
            width: 140px;
        }

        /* TYPE TABS for albums */
        .type-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .type-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-subtle);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .type-tab:hover, .type-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            text-decoration: none;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-subtle);
        }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-subtle);
            font-size: 12px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="navbar">
        <a href="/" class="logo">?? <span>PhotoSorter</span> Gallery</a>
        <nav>
            <a href="/" class="{% if active_page == 'home' %}active{% endif %}">Главная</a>
            <a href="/timeline" class="{% if active_page == 'timeline' %}active{% endif %}">Таймлайн</a>
            <a href="/albums" class="{% if active_page == 'albums' %}active{% endif %}">Альбомы</a>
            <a href="/faces" class="{% if active_page == 'faces' %}active{% endif %}">Лица</a>
        </nav>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        PhotoSorter Gallery v1.0 — Ваша локальная фотогалерея
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
